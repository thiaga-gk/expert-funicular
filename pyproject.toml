[project]
name = "databricks-sql-warehouse-optimizer"
version = "2.14.0"
description = "Deterministic Databricks SQL Warehouse optimization publisher"
requires-python = ">=3.10"
dependencies = ["databricks-sql-connector>=4.2.6", "jsonschema>=4.23", "openpyxl>=3.1"]

[tool.ruff]
line-length = 120

[project.scripts]
publisher = "publisher.cli.main:main"

[project.optional-dependencies]
test = ["pyyaml>=6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
