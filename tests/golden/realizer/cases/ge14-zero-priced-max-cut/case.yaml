id: GE-14
description: >-
  A zero-priced capacity cut: the scoped package lowers max clusters 4 to 2 (objective COST_GUARDRAIL, priced at 0
  because the warehouse never uses the clusters above 2) and the owner applies it exactly. The cut is no saving to
  realize: it is judged on queueing, which must stay at or below the safe level or not rise.
publisher:
  warehouse: wh-demo-006
  scope: [current:max-clusters]
world:
  changes:
  - {at: "2026-10-08T14:32:00Z", set: {max: 2}}
expect:
  conformance: EXACT
  applied_at: "2026-10-08T14:32:00Z"
  measured: false
  not_measured_reason: KNOB_NOT_REPLAYED
  independent_changes: []
  origin: INFERRED
  # The warehouse never reached the new cap of 2, so the old cap could have added nothing: upper bound 0.
  measurement: {levels.basis: OLD_CAP_UPPER_BOUND, levels.minutes_at_new_cap: 0, levels.cluster_minutes: 0}
  economics: {performance.old_cap_upper_bound.cluster_minutes: 0}
  # Queueing stayed at 0 percent: the cut is safe. Its billed change is reported, not claimed.
  realization_state: CAPACITY_VALIDATED
  classification: CAPACITY_VALIDATED
  claim: NOT_ATTRIBUTABLE
