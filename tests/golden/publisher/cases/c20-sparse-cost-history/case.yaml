name: c20-sparse-cost-history
description: 'C20 Sparse / new warehouse: a mature 30-day epoch billed on only 4 days, three days apart (no weekly or slower
  cadence to average). The forward DBU cost is unknown (too few active cost days to forecast), never $0 or a guessed run rate;
  savings estimates and the migration comparison abstain.'
expect:
  assertions:
  - equals: null
    path: cost_baseline.forward_365d.dbu_cost
  - equals: UNAVAILABLE
    path: cost_baseline.forward_365d.dbu_basis
  - equals: UNAVAILABLE
