    role: primary
    signature:
      - {feature: pct_job, gte: 20}
      - {feature: pct_bi, gte: 20}
    drift: [pct_job, pct_bi]
  - {id: C24, title: Many small duplicate warehouses, status: fail, role: modifier}
  - id: C25
