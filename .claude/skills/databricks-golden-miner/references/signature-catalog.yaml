# Machine-checkable signatures of the golden-scenario registry rows (docs/proposals/publisher/golden-scenarios.md).
#
# Each row:
#   id / title / status   -- the registry row (status = pass | fail, copied from the registry's Status column)
#   role                  -- primary: a workload or capacity shape; modifier: a cross-cutting attribute (type, billing,
#                            tags, maturity). A warehouse that matches no primary row is a gap.
#   signature             -- all conditions hold over the feature vector of scripts/mine_patterns.py features();
#                            {feature, <op>: value} with op eq|ne|in|not_in|gt|gte|lt|lte|is_null|not_null, or
#                            {any: [conditions]}. Rows without a signature are checked by hand (listed as manual).
#   expect                -- the row's expected behaviour as assertions on the warehouse's package, in the golden
#                            assertion DSL (tests/golden/publisher/test_golden_publisher.py docstring) plus `in` / `not_in` per
#                            value and `any: [assertions]`. Candidates carry `direction` (up/down/same/change).
#                            A failed assertion is a behaviour mismatch.
#   drift                 -- features whose live range is compared with the demo-fleet warehouse of the row.
#
# Premises (top-level `premises`): an assumption that the expected behaviour of the listed rows rests on.
#   assumes   -- the publisher setting that encodes it (a Thresholds field or a config/defaults constant) and its value;
#                tests/unit/skills/test_golden_miner.py fails when the setting changes, so the premise is re-read then.
#   when      -- conditions that scope it to the warehouses it applies to.
#   check     -- conditions that hold when live evidence agrees with the assumption. Checked only on warehouses that
#                match one of `rows`; a missing feature value makes it unknown, never contradicted. The numbers are a
#                tolerance band around the assumed value, not policy.
#
# Thresholds here describe what a pattern looks like; they are not publisher policy. Policy values live in
# src/publisher/governor/thresholds.py and docs/reference/publisher/thresholds.md. Edit this catalog when a registry row is
# added or its signature changes; tests/unit/skills/test_golden_miner.py checks that every demo-fleet warehouse
# matches its own row.
version: 1.1.0
premises:
  - id: P-RESTART-PRO
    text: A Pro/Classic restart takes about 4 minutes, so it costs about 4 cluster-minutes per started cluster and the first query after a stop waits about that long.
    assumes: {name: restart_cost_cluster_minutes_pro_classic, value: 4.0}
    rows: [C01, C02, C05, C13, C25, C49, C51, C53, C54]
    when:
      - {feature: warehouse_type, in: [PRO, CLASSIC]}
    check:
      - {feature: p95_wait_compute_ms_when_waited_30, lte: 480000}  # within 2x of 4 minutes
  - id: P-RESTART-SERVERLESS
    text: A Serverless restart takes seconds (about 0.1 cluster-minutes), so a lower auto-stop adds almost no restart cost or wait.
    assumes: {name: restart_cost_cluster_minutes_serverless, value: 0.1}
    rows: [C02, C14, A01]
    when:
      - {feature: warehouse_type, eq: SERVERLESS}
    check:
      - {feature: p95_wait_compute_ms_when_waited_30, lte: 60000}
  - id: P-SIZE-RATE
    text: Billed Pro/Classic DBU per cluster-hour follows the published size ratio within the accepted band, so a one-size change is priced from the workspace's own rates.
    assumes: {name: size_rate_published_band, value: 0.25}
    rows: [C06, C07, C22, C47, C55]
    when:
      - {feature: warehouse_type, in: [PRO, CLASSIC]}
    check:
      - {feature: size_rate_deviation, lte: 0.25}
  - id: P-QUERIES-PER-CLUSTER
    text: One Pro/Classic cluster serves about 10 concurrent queries, so queueing at the ceiling starts near 10 concurrent queries per cluster and the max-cluster target is concurrency / 10.
    assumes: {name: QUERIES_PER_CLUSTER_PRO_CLASSIC, value: 10}
    rows: [C08, C09, C42, C50]
    when:
      - {feature: warehouse_type, in: [PRO, CLASSIC]}
      - {feature: queued_query_pct_30, gte: 5}
      - {feature: time_at_max_pct, gte: 50}
    check:
      - {feature: concurrency_per_cluster_at_peak, gte: 5}  # queueing at max with < 5 queries per cluster: capacity is lower
rows:
  - id: C01
    title: Always-on idle
    status: pass
    role: primary
    signature:
      - {feature: auto_stop_minutes, eq: 0}
      - {feature: busy_ratio, lt: 0.3}
    expect:
      - any:
          - {path: "candidates[knob=auto_stop_minutes].status", in: [ACTIONABLE, TEST_REQUIRED, REVIEW]}
          - {path: "candidates[knob=auto_stop_minutes].blockers", includes: [SHORT_QUERIES_KEEP_WAREHOUSE_RUNNING]}
    drift: [busy_ratio, queries_30, active_days_30]
  - id: C02
    title: Long auto-stop, bursty BI
    status: pass
    role: primary
    signature:
      - {feature: auto_stop_minutes, gte: 20}
      - {feature: gap_p90_below_auto_stop, eq: true}
      - {feature: busy_ratio, lt: 0.3}
      - {feature: active_days_30, lt: 28}
    drift: [busy_ratio, p90_gap_minutes, auto_stop_minutes]
  - id: C03
    title: Uptime with zero queries
    status: pass
    role: primary
    signature:
      - {feature: queries_30, eq: 0}
      - {feature: billed_days_30, gt: 0}
    expect:
      - {path: "candidates[knob=auto_stop_minutes].status", equals: REVIEW}
      - {path: "candidates[knob=auto_stop_minutes].blockers", includes: [NO_QUERIES_WHILE_RUNNING]}
    drift: [billed_days_30, auto_stop_minutes]
  - id: C04
    title: Metadata / keep-alive polling
    status: fail
    role: primary
    signature:
      - {feature: auto_stop_minutes, gt: 0}
      - {feature: gap_p90_below_auto_stop, eq: true}
      - {feature: busy_ratio, lt: 0.15}
      - {feature: active_days_30, gte: 28}
      - {feature: starts_30, lte: 2}
    expect:
      - {path: "candidates[knob=auto_stop_minutes].status", not_in: [ACTIONABLE, TEST_REQUIRED]}
    drift: [busy_ratio, p90_gap_minutes, queries_30]
  - id: C05
    title: Scheduled ETL, idle most of the day
    status: pass
    role: primary
    signature:
      - {feature: pct_job, gte: 50}
      - {feature: auto_stop_minutes, gte: 30}
      - {feature: p50_gap_minutes, gte: 60}
    expect:
      - {path: "candidates[knob=auto_stop_minutes].direction", in: [down, same]}
    drift: [p50_gap_minutes, p95_execution_ms_30, auto_stop_minutes]
  - id: C06
    title: Over-sized
    status: pass
    role: primary
    signature:
      - {feature: size_rank, gte: 3}
      - {feature: spill_query_pct_30, lt: 1}
      - {feature: queued_query_pct_30, lt: 1}
      - {feature: p95_execution_ms_30, lte: 10000}
      - {feature: busy_ratio, lt: 0.5}
      - {feature: cost_history_days, gte: 14}
    expect:
      - {path: "candidates[knob=warehouse_size].direction", in: [down, same]}
    drift: [p95_execution_ms_30, busy_ratio, peak_concurrency_recent]
  - id: C07
