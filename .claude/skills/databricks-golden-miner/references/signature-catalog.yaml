    expect:
      - {path: "candidates[knob=warehouse_size].direction", in: [up, same]}
    drift: [spill_query_pct_30, total_spill_gib_30, p95_execution_ms_30]
  - id: C08
    title: Concurrency-constrained
    status: pass
    role: primary
    signature:
      - {feature: queued_query_pct_30, gte: 5}
      - {feature: time_at_max_pct, gte: 50}
    expect:
      - {path: "candidates[knob=max_clusters].direction", in: [up, same]}
      - {path: "candidates[knob=warehouse_size].direction", in: [up, same]}
    drift: [queued_query_pct_30, p95_wait_capacity_ms_when_queued_30, peak_concurrency_recent, time_at_max_pct]
  - id: C09
    title: Unused max-cluster ceiling
    status: pass
    role: primary
    signature:
      - {feature: ceiling_headroom, gte: 3}
