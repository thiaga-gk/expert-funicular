# Chapter map: the single list of chapters in the guide, in reading order.
#
# id        anchor in the page and the fragment file name: assets/chapters/<id>.html
# group     sidebar group heading
# sources   repo paths (files or folders) the chapter explains. build_guide.py fingerprints their contents; when a
#           fingerprint changes, `--stale` lists the chapter for a rewrite. A folder covers every file under it.
# docs      the documents that own the chapter's topics (shown in the "Where this lives" panel). The guide teaches
#           and points; these documents stay the single home of each topic (docs/README.md). They are fingerprinted
#           too: a changed document lists the chapter for REVIEW (read the doc diff; rewrite only if the meaning moved).
#
# Coverage: every file under src/ and schema/ belongs to at least one chapter's sources or matches an `ignore` entry
# below (a path or a glob, with the reason it has nothing to teach). `--stale` reports anything else as UNCOVERED,
# `--verify` and tests/test_docs.py fail on it. A new module therefore costs one line here: the chapter that should
# explain it, or an ignore entry.
