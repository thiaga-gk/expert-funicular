ignore:
  - path: "src/**/__init__.py"
    reason: Package docstrings only; each package's content is covered through its modules.
  - path: src/publisher/common/time.py
    reason: Timestamp parsing and UTC formatting helpers; no business rules.
  - path: src/publisher/common/utils.py
    reason: Generic value coercion and serialization helpers; its docstring forbids business rules there.
  - path: src/realizer/common/utils.py
    reason: Deterministic timestamp, decimal, money-string and JSON file helpers; no domain logic.
  - path: src/publisher/config/settings.py
    reason: Repository-relative locations of the committed schema and pricing files.
