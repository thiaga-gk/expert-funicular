# Teaching notes for the ledger explorer (the document is a JSON array of entries). Keys: [] for the entry index.
"[]": "One ledger entry: one fact the Realizer learned, appended to <code>state/realization/ledger/&lt;RPKG&gt;.jsonl</code> and never rewritten."
"[].ledger_entry_id": "<code>RLE-</code> id: hashes the ledger contract major, the RPKG, the event type, the business key and the payload. A repeated fact has the same id and is suppressed."
"[].ledger_contract_version": "The ledger envelope version; its major is part of every entry id."
"[].realization_package_id": "The RPKG this ledger belongs to: one ledger file per RPKG."
"[].recommendation_package_id": "The source PKG, repeated on every entry so a single line is self-describing."
"[].event_type": "What happened. The example records creation, the application, the three validation steps, the counterfactual and the measurement."
"[].effective_at_utc": "When the fact became true in the world (for an application: the epoch start of the change). A replay cut projects the ledger as of an effective time."
"[].recorded_at_utc": "When the Realizer wrote the entry. Differs from the effective time when a fact is discovered later."
"[].application_episode_id": "The APP- episode the entry belongs to; null for package-level facts such as REALIZATION_CREATED."
"[].validation_episode_id": "The VAL- episode, set on validation entries."
"[].measurement_id": "The MEAS- id, set on the economic measurement entry."
"[].payload": "The event's facts. Its business keys (episode, window, step ids) are part of the entry id."
"[].evidence_refs": "REVID- ids of the evidence files the entry rests on, under <code>state/realization/evidence/</code>."
"[].caused_by_entry_id": "The entry this one follows from, when an event is a consequence of another."
"[].corrects_entry_id": "Set on a correction (for example a billing restatement): the entry this one replaces. The original stays in the ledger."
"[].provenance": "Product, Realizer and policy versions at write time."
"[].payload.counterfactual_old_cost": "The counterfactual's cost for the window, recorded before the measurement that uses it."
"[].payload.method": "The counterfactual method. CALIBRATED_PRIOR_STATE is claim-eligible; CORRELATED_ONLY (migration) never is."
"[].payload.recognition_status": "CONFIRMED: guardrails passed and the counterfactual is eligible and not provisional. REJECTED when a guardrail failed; PROVISIONAL otherwise."
"[].payload.readiness": "The readiness checks with observed values and thresholds; all must pass before a run rate is published."
