# Teaching notes for the measurement evidence explorer. Keys: explorer paths, array indices as [].
"measurement_evidence_format_version": "The evidence format version. <code>--from-evidence</code> refuses other versions."
"as_of_utc": "The measurement time; the windows end at the last settled billing day before it."
"source": "Where the evidence came from (live system tables or the demo world)."
"assumptions": "The package's thresholds and restart costs the measurement used, recorded so a replay applies exactly the same values."
"assumptions.restart_cost_cluster_minutes_pro_classic": "Cluster-minutes one restart costs on Pro/Classic; multiplied by max(1, min_clusters) in the replay."
"aws": "Modeled AWS cluster-hour price per window (from the regional EC2 registry). Serverless has a true zero; an unknown price leaves the AWS component out."
"billing": "The billing watermark and the last settled day. Days after <code>settled_through</code> are never measured."
"daily_cost": "Billed DBU quantity and list cost per day (restated, retracted and unpriced quantities kept separately). Trimmed to three rows in the guide."
"daily_cost[].unpriced_dbu_quantity": "DBUs without a price. Any unpriced DBU makes the window's billed cost unknown (null), never zero."
"epochs": "The configuration timeline. The applied change is the boundary between the last two epochs."
"guard": "Guard metrics for the PREVIOUS and CURRENT epoch: failure, queued and spill shares and p95 on shared statement sources."
"windows": "The pre- and post-change windows: settled whole days on either side of the change."
"windows.post.replay": "One row per candidate auto-stop value: idle cluster-minutes it would add and restarts it would avoid (or remove and add) on these days."
"windows.post.replay[].added_idle_cluster_minutes": "Idle cluster-minutes the replayed (old) value would have kept the warehouse running on the post-change days."
"windows.post.replay[].avoided_starts": "Restarts the replayed value would have avoided; each costs the restart cost in cluster-minutes."
"windows.post.running": "Observed running time, segments, restarts and queries in the window; running cluster-minutes price the DBU per minute."
"windows.post.running.observed_running_cluster_minutes": "Cluster-minutes the warehouse actually ran after the change. Billed cost divided by this is the DBU price per cluster-minute."
"windows.post.levels": "Running minutes per cluster count, used by min- and max-cluster counterfactuals; null for an auto-stop step."
"size_runtime": "Per-source execution medians before and after, used for the size runtime ratio; null for an auto-stop step."
