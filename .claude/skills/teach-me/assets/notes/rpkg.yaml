# Teaching notes for the realization package (RPKG) explorer. Keys: explorer paths, array indices as []. Values: inline HTML.
"contract_version": "The realization package contract version. Its major version is part of the RPKG id, so a breaking contract change gives every package a new realization."
"realization_package_id": "<code>RPKG-</code> + 24 hex of SHA-256 over <code>REALIZATION_PACKAGE</code>, the contract major and the PKG id. One PKG always maps to exactly one RPKG."
"snapshot_id": "<code>RSNAP-</code> id: hashes the RPKG, <code>history.ledger_checkpoint_hash</code> and the projector version, so it names the exact ledger state this view was projected from."
"as_of_utc": "The measurement time this view reflects (the latest effective time it covers), not the wall-clock time of the run."
"source_recommendation": "The immutable PKG this realization belongs to: id, full hash, epoch, recommended scenario, cost profile and run scope, plus the links a later package adds when it supersedes or succeeds this one."
"source_recommendation.disposition": "Whether the source package is still the live recommendation (ACTIVE) or was SUPERSEDED, EXPIRED or BLOCKED. Independent of whether its applied change is still being monitored."
"source_recommendation.package_hash_full_sha256": "Copied from the PKG's provenance. The Realizer recomputed it before accepting the package, so a hand-edited package never gets this far."
"current_state": "The headline axes, kept separate on purpose: realization (savings against expectation), validation (performance held?), maturity (how much history) and the source package's disposition."
"current_state.realization_state": "Set by the classification ladder in <code>calculate_economics</code>: REALIZED here because the annualized saving is at or above the published low."
"current_state.validation_state": "PASSED when every guard rule passed; FAILED on any FAIL; an UNKNOWN rule keeps it not ready, never failed."
"current_state.maturity_state": "REPRESENTATIVE: measured with readiness passed. MATURE needs 365 covered days."
"application": "What the Reconciler matched: the step, the knob, the source, recommended and observed values, when the change took effect and how exactly it followed the plan."
"application.implementation_conformance": "EXACT: the observed value is the recommended one. MODIFIED gets a re-estimated denominator (auto-stop option grid); CONTRARY and UNRELATED are never claimed."
"application.effective_from_utc": "When the change took effect: the start of the new configuration epoch in <code>system.compute.warehouses</code>, not when the Realizer saw it."
"application.step_role": "What the step is for, from its candidate: SAVINGS here. PERFORMANCE and CAPACITY steps are judged on queueing and p95 and never claimed; SAFETY_ROLLBACK steps are never measured."
"application.plan_progress": "How far the recommended plan has been applied: here one of two authoritative steps (the size canary is still pending), so PARTIALLY_COMPLETED."
"application.open_episodes": "Application episodes not yet closed by drift or a rollback. The view shows the open episode of the earliest applied step."
"validation": "The validation episode: readiness checks and the guard rules judged over one window, with the policy snapshot that judged them."
"validation.readiness": "Minimum days, minimum queries, a representative regime, sufficient evidence and no guard without evidence. Only a ready measurement publishes a run rate."
"validation.rules": "One entry per fail-fast guard. Two-part rules (operator <code>NOT(GT_SAFE_AND_GT_PREVIOUS_X_MARGIN)</code>) fail only when the value is above its safe level and worse than before by more than the margin."
"validation.rules[].rule_id": "REAL-FAIL-001 failures, REAL-COLD-001 added cold starts (auto-stop), REAL-QUEUE-001, REAL-SPILL-001 (size), REAL-P95-001. The limits come from the package's cost profile."
"validation.policy_snapshot_id": "The PSNAP- id of the Realizer policy values used. A policy change gives a new snapshot and a POLICY_DIFF_RECORDED entry."
"economics": "Realized economics for the measured window: counterfactual and observed cost, the realized delta, the run rate and its classification against the package's expectation."
"economics.counterfactual_old_cost": "What the old configuration would have cost on the actual post-change days: observed new cost plus the replayed DBU and AWS saving."
"economics.observed_new_cost": "Billed DBU cost of the post-change window plus modeled AWS for its running cluster-minutes (cost basis DBU_AND_MODELED_AWS)."
"economics.realized_savings_period": "counterfactual_old_cost − observed_new_cost, for the window's days only."
"economics.annualized_realized_savings": "realized × 365 / period_days, published only when readiness passed and the state publishes a run rate."
"economics.expected_same_scope_annual_savings": "The denominator: here the applied candidate's isolated base savings (denominator_source PUBLISHER_CANDIDATE)."
"economics.expected_range": "The published low/base/high the run rate is classified against; component <code>total</code> because AWS was modeled."
"economics.realization_ratio": "annualized / expected. Used for classification only when no published range exists; here informational."
"economics.classification_detail": "The rung of the classification ladder that decided: REALIZED (not REALIZED_ABOVE_RANGE_REVIEW, because the run rate is below 1.25 × high)."
"economics.measurement": "How the number was measured: method, knob, values, cost basis, the replay, the billed cross-check and both windows."
"economics.measurement.method": "AUTO_STOP_REPLAY: the old auto-stop replayed on the observed post-change running time."
"economics.measurement.replay": "The replay row: idle cluster-minutes the old value adds, restarts it avoids, the restart cost, and the per-minute DBU and per-hour AWS prices."
"economics.measurement.replay.net_cluster_minutes": "added_idle − avoided_starts × restart_cost: the cluster-minutes the old value would have cost more on these days."
"economics.measurement.replay.dbu_cost_per_cluster_minute": "The post window's billed DBU cost divided by its observed running cluster-minutes: what this warehouse actually paid per minute."
"economics.measurement.cross_check": "The billed cross-check: the drop in billed DBU cost (volume-scaled) against the replayed saving, judged against week-to-week noise."
"economics.measurement.cross_check.outcome": "AGREES: same sign and within 25%. DISAGREES is a hard attribution disqualifier; INCONCLUSIVE is neutral."
"economics.measurement.pre_window": "The settled window before the change: billed cost, DBU, queries, restarts and running time. Used by the cross-check and the volume ratio."
"economics.measurement.post_window": "The settled window after the change, the one the counterfactual prices."
"economics.measurement.volume_ratio": "Post over pre query volume. Outside 0.75 to 1.25 the result is MONITORING with WORKLOAD_SHIFT."
"economics.quality_gates": "Financial-quality gates on the billing evidence: attributable spend, price coverage, currency, correction chain, cost components. A null input fails its gate."
"economics.realized_to_date": "Coverage of the measurements so far: first and last covered day, days covered and uncovered gaps."
"attribution": "Whether the saving can be claimed for the recommendation: hard disqualifiers, origin, quality gates and the resulting claim status."
"attribution.attribution_claim_status": "CLAIMABLE: no disqualifier, a CONFIRMED or INFERRED origin and every gate passing. Otherwise OBSERVABLE_ONLY or NOT_ATTRIBUTABLE."
"attribution.origin_attribution": "INFERRED: the knob changed after the package was generated. CONFIRMED needs an approvals file naming the package, knob and value."
"attribution.hard_disqualifiers": "Empty here. Any entry (for example BILLED_CROSS_CHECK_DISAGREES or CANARY_GUARD_WINDOW_OPEN) blocks the claim."
"attribution.recommendation_attributed_realized_savings": "The claimed saving for the window: equal to the realized saving when CLAIMABLE, otherwise 0."
"maturity": "NOT_APPLIED → COLLECTING → PROVISIONAL → REPRESENTATIVE → MATURE (365 covered days)."
"drift": "Whether the configuration moved away from the applied value after the application (a DRIFT_DETECTED entry closes the episode)."
"regeneration": "Whether the Realizer asked for a new Publisher run (a RERUN- request), for example after drift or an invalidating change."
"history": "The ledger checkpoint this view was projected from: entry counts, first and latest entry and the checkpoint hash."
"history.ledger_checkpoint_hash": "<code>SHA256:</code> over the ordered ledger entry ids. Part of the snapshot id."
"provenance": "The Realizer component versions that produced this view. A version change can change the snapshot id without changing the ledger."
