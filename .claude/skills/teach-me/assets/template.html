.jx { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 0; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); overflow: hidden; }
.jx-bar { grid-column: 1 / -1; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--surface-2); }

.trace .body h4 { margin: 4px 0 0; }

/* quiz */
.quiz { display: grid; gap: 8px; max-width: var(--measure); }
.quiz > b { font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; color: var(--fg-3); }
.quiz details { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.quiz summary { cursor: pointer; padding: 10px 14px; font-weight: 550; list-style: none; display: flex; gap: 10px; }
.quiz summary::before { content: "Q"; font: 700 .78rem var(--f-mono); color: var(--accent); padding-top: 3px; }
.quiz summary::-webkit-details-marker { display: none; }
.quiz details[open] summary { border-bottom: 1px dashed var(--line); }
.quiz details > div { padding: 10px 14px 12px 36px; color: var(--fg-2); font-size: .93rem; display: grid; gap: 6px; }

/* glossary terms */
.term { border-bottom: 1px dashed var(--fg-3); cursor: help; position: relative; }
.term:hover, .term:focus { border-bottom-color: var(--accent); color: var(--accent-ink); outline: none; }
.tip { position: fixed; z-index: 60; max-width: min(24rem, calc(100vw - 32px)); background: var(--fg); color: var(--bg); padding: 10px 12px; border-radius: 8px; font-size: .84rem; line-height: 1.45; box-shadow: var(--shadow); pointer-events: none; }
.tip b { display: block; margin-bottom: 2px; }
dl.gloss { display: grid; grid-template-columns: minmax(9rem, 14rem) minmax(0, 1fr); gap: 0; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); overflow: hidden; margin: 0; }
dl.gloss dt, dl.gloss dd { padding: 10px 14px; border-bottom: 1px solid var(--line); margin: 0; }
dl.gloss dt { font-weight: 650; background: var(--surface-2); }
dl.gloss dd { font-size: .92rem; color: var(--fg-2); }

/* search palette */
.palette { position: fixed; inset: 0; z-index: 70; background: color-mix(in srgb, var(--fg) 35%, transparent); display: grid; place-items: start center; padding: 12vh 16px 16px; }
.palette-box { width: min(40rem, 100%); background: var(--surface); border: 1px solid var(--line-2); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; }
.palette input { width: 100%; border: 0; border-bottom: 1px solid var(--line); padding: 14px 16px; font: 1rem var(--f-body); background: var(--surface); color: var(--fg); outline: none; }
.palette ul { list-style: none; margin: 0; padding: 6px; max-height: 50vh; overflow: auto; }
.palette li a { display: flex; justify-content: space-between; gap: 10px; padding: 8px 10px; border-radius: 6px; color: var(--fg); text-decoration: none; }
.palette li a span { color: var(--fg-3); font-size: .8rem; white-space: nowrap; }
.palette li a.on { background: var(--accent-soft); }

.foot { padding-block: 40px; color: var(--fg-3); font-size: .84rem; display: grid; gap: 6px; }

/* single-column grids must not grow to their widest child (code, formulas, tables scroll inside themselves) */
.hero, section.chapter, .ch-head, .formula, .card, .trace .body, .jx-side, .range, .quiz, .callout { grid-template-columns: minmax(0, 1fr); }
main, .col { min-width: 0; max-width: 100%; }

/* svg arrow defs live in a zero-size svg; display:none would drop the markers */
.defs { position: absolute; width: 0; height: 0; overflow: hidden; }

@media (max-width: 960px) {
  .rail { transform: translateX(-100%); transition: transform .2s ease; box-shadow: var(--shadow); }
  body.nav-open .rail { transform: none; }
  main { margin-left: 0; }
  .topbar { display: flex; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); padding: 10px 16px; gap: 10px; align-items: center; margin-inline: calc(-1 * clamp(16px, 4vw, 56px)); }
  .topbar b { font: 600 1rem var(--f-display); margin-right: auto; }
  .jx { grid-template-columns: minmax(0, 1fr); }
  .jx-tree { border-right: 0; border-bottom: 1px solid var(--line); max-height: 26rem; }
  dl.gloss { grid-template-columns: minmax(0, 1fr); }
  dl.gloss dt { border-bottom: 0; }
}
@media print {
  .rail, .topbar, .btn, .filter { display: none !important; }
  main { margin: 0; }
  section.chapter { break-before: page; }
  .quiz details > div { display: grid; }
}
</style>
</head>

<script type="application/json" id="guide-data"><!--@DATA@--></script>
<script type="application/json" id="guide-meta"><!--@META@--></script>
<script>
(function () {
  "use strict";
  var DATA = JSON.parse(document.getElementById("guide-data").textContent);
  var root = document.documentElement;

  /* ---------- theme: system -> light -> dark ---------- */
  var themeBtn = document.getElementById("theme");
  function store(k, v) { try { if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} }
  function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function applyTheme(t) {
    if (t === "light" || t === "dark") root.setAttribute("data-theme", t); else root.removeAttribute("data-theme");
    themeBtn.textContent = t === "light" ? "Light" : t === "dark" ? "Dark" : "System";
    themeBtn.setAttribute("aria-label", "Colour theme: " + themeBtn.textContent + ". Click to change.");
  }
  var theme = load("guide-theme") || "system";
  applyTheme(theme);
  themeBtn.addEventListener("click", function () {
    theme = theme === "system" ? "light" : theme === "light" ? "dark" : "system";
    store("guide-theme", theme === "system" ? null : theme);
    applyTheme(theme);
  });

  /* ---------- mobile nav ---------- */
  var menu = document.getElementById("menu");
  menu.addEventListener("click", function () {
    var open = document.body.classList.toggle("nav-open");
    menu.setAttribute("aria-expanded", open ? "true" : "false");
  });
  document.getElementById("toc").addEventListener("click", function (e) {
    if (e.target.closest("a")) { document.body.classList.remove("nav-open"); menu.setAttribute("aria-expanded", "false"); }
  });

  /* ---------- scroll spy ---------- */
  var links = {};
  document.querySelectorAll(".toc a[href^='#']").forEach(function (a) { links[a.getAttribute("href").slice(1)] = a; });
  var watched = document.querySelectorAll("section.chapter, section.chapter h3[id]");
  if ("IntersectionObserver" in window) {
    var current = null;
    var spy = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (!en.isIntersecting) return;
        var id = en.target.id; if (!links[id]) return;
        if (current) current.classList.remove("active");
        current = links[id]; current.classList.add("active");
        document.querySelectorAll(".toc-item.open").forEach(function (x) { x.classList.remove("open"); });
        var item = current.closest(".toc-item"); if (item) item.classList.add("open");
      });
    }, { rootMargin: "-15% 0px -75% 0px" });
    watched.forEach(function (el) { if (el.id) spy.observe(el); });
  }

  /* ---------- glossary tooltips ---------- */
  var tip = null;
  function showTip(el) {
    var g = DATA.glossary[el.getAttribute("data-term")]; if (!g) return;
    hideTip();
    tip = document.createElement("div"); tip.className = "tip"; tip.setAttribute("role", "tooltip");
    var b = document.createElement("b"); b.textContent = g.term; tip.appendChild(b);
    tip.appendChild(document.createTextNode(g.definition));
    document.body.appendChild(tip);
    var r = el.getBoundingClientRect(), w = tip.offsetWidth, h = tip.offsetHeight;
    var left = Math.min(Math.max(16, r.left), window.innerWidth - w - 16);
    var top = r.bottom + 8; if (top + h > window.innerHeight - 8) top = r.top - h - 8;
    tip.style.left = left + "px"; tip.style.top = top + "px";
  }
  function hideTip() { if (tip) { tip.remove(); tip = null; } }
  document.querySelectorAll(".term").forEach(function (el) {
    el.setAttribute("tabindex", "0");
    el.addEventListener("mouseenter", function () { showTip(el); });
    el.addEventListener("focus", function () { showTip(el); });
    el.addEventListener("mouseleave", hideTip);
    el.addEventListener("blur", hideTip);
  });
  window.addEventListener("scroll", hideTip, { passive: true });

  /* ---------- copy buttons ---------- */
  document.querySelectorAll("pre.code").forEach(function (pre) {
    var b = document.createElement("button"); b.type = "button"; b.className = "btn copy"; b.textContent = "Copy";
    b.addEventListener("click", function () {
      var text = pre.querySelector("code") ? pre.querySelector("code").textContent : pre.textContent;
      function done(ok) { b.textContent = ok ? "Copied" : "Select and copy"; setTimeout(function () { b.textContent = "Copy"; }, 1600); }
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function () { done(true); }, function () { done(false); });
      else done(false);
    });
    pre.appendChild(b);
  });

  /* ---------- range bars ---------- */
  function money(v) { var s = Math.abs(v).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 }); return (v < 0 ? "−" : "") + s; }
  document.querySelectorAll(".range[data-low]").forEach(function (el) {
    var lo = +el.dataset.low, base = +el.dataset.base, hi = +el.dataset.high;
    var obs = el.dataset.obs !== undefined ? +el.dataset.obs : null;
    var vals = [lo, base, hi, 0].concat(obs === null ? [] : [obs]);
    var min = el.dataset.min !== undefined ? +el.dataset.min : Math.min.apply(null, vals);
    var max = el.dataset.max !== undefined ? +el.dataset.max : Math.max.apply(null, vals) * 1.06;
    function pos(v) { return ((v - min) / (max - min) * 100).toFixed(2) + "%"; }
    var unit = el.dataset.unit || "";
    var label = el.dataset.label || "";
    el.innerHTML = '<div class="rl"><span>' + label + '</span><span>low <b>' + money(lo) + '</b> · base <b>' + money(base) + '</b> · high <b>' + money(hi) + "</b>" +
      (obs === null ? "" : ' · observed <b>' + money(obs) + "</b>") + " " + unit + "</span></div>" +
      '<div class="track" role="img" aria-label="' + label + ": low " + money(lo) + ", base " + money(base) + ", high " + money(hi) + (obs === null ? "" : ", observed " + money(obs)) + '">' +
      (min < 0 ? '<div class="zero" style="left:' + pos(0) + '"></div>' : "") +
      '<div class="band" style="left:' + pos(lo) + ";width:calc(" + pos(hi) + " - " + pos(lo) + ')"></div>' +
      '<div class="tick" style="left:' + pos(base) + '" title="base"></div>' +
      (obs === null ? "" : '<div class="tick obs" style="left:' + pos(obs) + '" title="observed"></div>') +
      '</div><div class="scale"><span>' + money(min) + "</span><span>" + money(max) + "</span></div>";
  });

  /* ---------- table filters (blocker lookup, thresholds) ---------- */
  document.querySelectorAll("[data-filter-for]").forEach(function (box) {
    var table = document.getElementById(box.getAttribute("data-filter-for"));
    var input = box.querySelector("input"), count = box.querySelector(".count");
    var group = "";
    function run() {
      var q = input.value.trim().toLowerCase(), n = 0;
      table.querySelectorAll("tbody tr").forEach(function (tr) {
        if (tr.classList.contains("grp")) { tr.hidden = !!q || !!group; return; }
        var ok = (!q || tr.textContent.toLowerCase().indexOf(q) >= 0) && (!group || tr.getAttribute("data-group") === group);
        tr.hidden = !ok; if (ok) n++;
      });
      if (count) count.textContent = n + " shown";
    }
    input.addEventListener("input", run);
    box.querySelectorAll("button[data-group]").forEach(function (b) {
      b.addEventListener("click", function () {
        var g = b.getAttribute("data-group");
        group = group === g ? "" : g;
        box.querySelectorAll("button[data-group]").forEach(function (x) { x.setAttribute("aria-pressed", x.getAttribute("data-group") === group ? "true" : "false"); });
        run();
      });
    });
    run();
  });

  /* ---------- JSON explorer ---------- */
  var ID_RE = /^(PKG|CAND|SCN|EVID|EPOCH|REAL|RPKG|RLE|RSNAP|APP|VAL|MEAS|CF|REVID|RERUN|PSNAP)-[0-9A-F]{24}$/;
  function typeOf(v) { return v === null ? "null" : Array.isArray(v) ? "array" : typeof v; }
  function schemaPath(path) { return path.replace(/\[\d+\]/g, "[]").replace(/\.(EVID|CAND|SCN|EPOCH)-[0-9A-F]{24}/g, ".{id}"); }
  function pathJoin(p, k, isIndex) { return isIndex ? p + "[" + k + "]" : (p ? p + "." + k : k); }
  function preview(v) {
    var t = typeOf(v);
    if (t === "object") { var n = Object.keys(v).length; return { cls: "meta", text: "{" + n + (n === 1 ? " field}" : " fields}") }; }
    if (t === "array") return { cls: "meta", text: "[" + v.length + (v.length === 1 ? " item]" : " items]") };
    if (t === "null") return { cls: "z", text: "null" };
    if (t === "string") return { cls: ID_RE.test(v) ? "id" : "s", text: '"' + v + '"' };
    if (t === "number") return { cls: "n", text: String(v) };
    return { cls: "b", text: String(v) };
  }
  function explorer(el) {
    var src = el.getAttribute("data-src"), spec = DATA.explorers[src];
    if (!spec) { el.textContent = "Missing explorer data: " + src; return; }
    var doc = spec.document, start = el.getAttribute("data-path") || "", openDepth = +(el.getAttribute("data-open") || 1);
    var node = doc;
    if (start) start.split(".").forEach(function (part) {
      var m = part.match(/^([^\[]*)((?:\[\d+\])*)$/);
      if (m[1]) node = node[m[1]];
      (m[2].match(/\d+/g) || []).forEach(function (i) { node = node[+i]; });
    });
    var defs = {}, rows = [];
    el.classList.add("jx");
    var bar = document.createElement("div"); bar.className = "jx-bar";
    bar.innerHTML = '<span class="t"></span>';
    bar.querySelector(".t").textContent = spec.title + (start ? "  ›  " + start : "");
    var bOpen = document.createElement("button"); bOpen.type = "button"; bOpen.className = "btn"; bOpen.textContent = "Expand all";
    var bClose = document.createElement("button"); bClose.type = "button"; bClose.className = "btn"; bClose.textContent = "Collapse";
    bar.appendChild(bOpen); bar.appendChild(bClose);
    var tree = document.createElement("div"); tree.className = "jx-tree"; tree.setAttribute("role", "tree");
    var side = document.createElement("div"); side.className = "jx-side"; side.setAttribute("aria-live", "polite");
    side.innerHTML = '<p class="empty">Select a field to see its type, its meaning in the contract and a teaching note. Underlined IDs jump to the record they name.</p>';
    el.appendChild(bar); el.appendChild(tree); el.appendChild(side);

    function build(value, key, path, depth, isIndex) {
      var li = document.createElement("li");
      var row = document.createElement("div"); row.className = "jx-row"; row.setAttribute("role", "treeitem"); row.tabIndex = 0;
      var t = typeOf(value), container = t === "object" || t === "array";
      var tog = document.createElement("span"); tog.className = "jx-tog"; tog.textContent = container ? "▾" : "";
      var k = document.createElement("span"); k.className = "jx-k"; k.textContent = isIndex ? "[" + key + "]" : key;
      var sp = schemaPath(path);
      if (spec.notes[sp] || spec.fields[sp]) k.classList.add("noted");
      var pv = preview(value), v = document.createElement("span"); v.className = "jx-v " + pv.cls; v.textContent = pv.text;
      row.appendChild(tog); if (key !== "") row.appendChild(k); row.appendChild(v);
      li.appendChild(row);
      row._path = path; row._value = value; row._li = li;
      rows.push(row);
      if (!isIndex && ID_RE.test(key)) defs[key] = defs[key] || row;
      if (t === "string" && ID_RE.test(value)) {
        (spec.defs || []).forEach(function (re) { if (new RegExp(re).test(path) && !defs[value]) defs[value] = row; });
      }
      if (container) {
        var ul = document.createElement("ul"); ul.setAttribute("role", "group");
        if (t === "array") value.forEach(function (x, i) { ul.appendChild(build(x, i, pathJoin(path, i, true), depth + 1, true)); });
        else Object.keys(value).forEach(function (kk) { ul.appendChild(build(value[kk], kk, pathJoin(path, kk, false), depth + 1, false)); });
        li.appendChild(ul);
        if (depth >= openDepth) li.classList.add("closed");
        row.setAttribute("aria-expanded", depth >= openDepth ? "false" : "true");
      }
      return li;
    }
    var top = document.createElement("ul");
    var rootLi = build(node, "", start, 0, false);
    top.appendChild(rootLi); tree.appendChild(top);

    function select(row) {
      tree.querySelectorAll(".jx-row.sel").forEach(function (r) { r.classList.remove("sel"); });
      row.classList.add("sel");
      var sp = schemaPath(row._path), f = spec.fields[sp], note = spec.notes[sp], val = row._value, t = typeOf(val);
      var html = '<div class="path"></div><div class="facts"></div>';
      side.innerHTML = html;
      side.querySelector(".path").textContent = row._path || "(document root)";
      var facts = side.querySelector(".facts");
      function chip(cls, text) { var c = document.createElement("span"); c.className = "chip " + cls; c.textContent = text; facts.appendChild(c); }
      chip("hold", t);
      if (f) { if (f.type) chip("pub", f.type); if (f.nullable === "Yes") chip("warn", "nullable"); if (f.required === "Yes") chip("hold", "required"); }
      if (f && f.text) { var p = document.createElement("p"); p.textContent = f.text; side.appendChild(p); }
      if (note) { var n = document.createElement("div"); n.className = "note"; n.innerHTML = note; side.appendChild(n); }
      if (t === "string" && ID_RE.test(val)) {
        var fam = DATA.id_families[val.split("-")[0]];
        if (fam) { var q = document.createElement("p"); q.innerHTML = "<b>" + val.split("-")[0] + "-</b> " + fam; side.appendChild(q); }
        if (defs[val] && defs[val] !== row) {
          var go = document.createElement("button"); go.type = "button"; go.className = "btn"; go.textContent = "Jump to " + val.split("-")[0] + " record";
          go.addEventListener("click", function () { reveal(defs[val]); });
          side.appendChild(go);
        }
      }
      if (t !== "object" && t !== "array") { var pre = document.createElement("div"); pre.className = "val"; pre.textContent = JSON.stringify(val); side.appendChild(pre); }
      if (f && f.ref) { var a = document.createElement("a"); a.href = f.ref; a.textContent = "Contract section: " + f.section; side.appendChild(a); }
      if (!f && !note && t !== "string") { var e = document.createElement("p"); e.className = "empty"; e.textContent = "No contract row for this path; see the parent field."; side.appendChild(e); }
    }
    function reveal(row) {
      var li = row._li.parentElement;
      while (li && li !== tree) { if (li.tagName === "LI") { li.classList.remove("closed"); var r = li.firstChild; if (r && r.setAttribute) r.setAttribute("aria-expanded", "true"); } li = li.parentElement; }
      var top = row.getBoundingClientRect().top - tree.getBoundingClientRect().top + tree.scrollTop;
      tree.scrollTop = Math.max(0, top - tree.clientHeight / 2);  /* scroll the tree only, never the page */
      row.classList.remove("flash"); void row.offsetWidth; row.classList.add("flash");
      select(row); row.focus({ preventScroll: true });
    }
    tree.addEventListener("click", function (e) {
      var row = e.target.closest(".jx-row"); if (!row) return;
      var li = row._li, hasKids = li.querySelector("ul");
      if (hasKids && (e.target.classList.contains("jx-tog") || row.classList.contains("sel"))) {
        li.classList.toggle("closed"); row.setAttribute("aria-expanded", li.classList.contains("closed") ? "false" : "true");
      }
      if (e.target.classList.contains("id") && defs[row._value] && defs[row._value] !== row) { reveal(defs[row._value]); return; }
      select(row);
    });
    tree.addEventListener("keydown", function (e) {
      var row = e.target.closest(".jx-row"); if (!row) return;
      var vis = rows.filter(function (r) { return r.offsetParent !== null; }), i = vis.indexOf(row);
      if (e.key === "ArrowDown" && vis[i + 1]) { vis[i + 1].focus(); select(vis[i + 1]); e.preventDefault(); }
      else if (e.key === "ArrowUp" && vis[i - 1]) { vis[i - 1].focus(); select(vis[i - 1]); e.preventDefault(); }
      else if (e.key === "ArrowRight" || e.key === "ArrowLeft" || e.key === "Enter") {
        if (row._li.querySelector("ul")) { row._li.classList.toggle("closed", e.key === "ArrowLeft" ? true : e.key === "ArrowRight" ? false : !row._li.classList.contains("closed")); row.setAttribute("aria-expanded", row._li.classList.contains("closed") ? "false" : "true"); }
        if (e.key === "Enter" && row.querySelector(".jx-v.id") && defs[row._value]) reveal(defs[row._value]);
        e.preventDefault();
      }
    });
    bOpen.addEventListener("click", function () { tree.querySelectorAll("li.closed").forEach(function (li) { li.classList.remove("closed"); }); });
    bClose.addEventListener("click", function () { tree.querySelectorAll("li").forEach(function (li) { if (li !== rootLi && li.querySelector("ul")) li.classList.add("closed"); }); });
    var first = el.getAttribute("data-select");
    if (first) { var target = rows.filter(function (r) { return r._path === first; })[0]; if (target) reveal(target); }
  }
  document.querySelectorAll("[data-src]").forEach(explorer);
  if (location.hash) { var h = document.getElementById(location.hash.slice(1)); if (h) h.scrollIntoView(); }

  /* ---------- search palette ---------- */
  var pal = document.getElementById("palette"), q = document.getElementById("q"), results = document.getElementById("results");
  var index = [];
  document.querySelectorAll("section.chapter").forEach(function (s) {
    var title = s.querySelector("h2") ? s.querySelector("h2").textContent : s.id;
    index.push({ t: title, k: "Chapter", h: "#" + s.id });
    s.querySelectorAll("h3[id]").forEach(function (h) { index.push({ t: h.textContent, k: title, h: "#" + h.id }); });
  });
  Object.keys(DATA.glossary).forEach(function (k) { index.push({ t: DATA.glossary[k].term, k: "Glossary", h: "#g-" + k }); });
  (DATA.search_extra || []).forEach(function (x) { index.push(x); });
  var sel = 0, shown = [];
  function render() {
    var s = q.value.trim().toLowerCase();
    shown = index.filter(function (x) { return !s || x.t.toLowerCase().indexOf(s) >= 0 || x.k.toLowerCase().indexOf(s) >= 0; }).slice(0, 40);
    sel = Math.min(sel, Math.max(0, shown.length - 1));
    results.innerHTML = "";
    shown.forEach(function (x, i) {
      var li = document.createElement("li"), a = document.createElement("a");
      a.href = x.h; a.className = i === sel ? "on" : "";
      a.textContent = x.t; var sp = document.createElement("span"); sp.textContent = x.k; a.appendChild(sp);
      a.addEventListener("click", closePal);
      li.appendChild(a); results.appendChild(li);
    });
  }
  function openPal() { pal.hidden = false; q.value = ""; sel = 0; render(); q.focus(); }
  function closePal() { pal.hidden = true; }
  document.getElementById("open-search").addEventListener("click", openPal);
  document.getElementById("open-search-m").addEventListener("click", openPal);
  pal.addEventListener("click", function (e) { if (e.target === pal) closePal(); });
  q.addEventListener("input", function () { sel = 0; render(); });
  q.addEventListener("keydown", function (e) {
    if (e.key === "ArrowDown") { sel = Math.min(sel + 1, shown.length - 1); render(); e.preventDefault(); }
    else if (e.key === "ArrowUp") { sel = Math.max(sel - 1, 0); render(); e.preventDefault(); }
    else if (e.key === "Enter" && shown[sel]) { location.hash = shown[sel].h; closePal(); e.preventDefault(); }
    else if (e.key === "Escape") closePal();
  });
  document.addEventListener("keydown", function (e) {
    var typing = /INPUT|TEXTAREA/.test((document.activeElement || {}).tagName || "");
    if ((e.key === "/" && !typing) || ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k")) { e.preventDefault(); openPal(); }
    else if (e.key === "Escape" && !pal.hidden) closePal();
  });
})();
</script>
</body>
